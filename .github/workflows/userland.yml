name: userland

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "userland/**"
      - "tools/mesa/**"
      - "tools/mk-mesa.sh"
      - "xnu-deps/**"
      - "xnu-env.sh"
      - ".github/workflows/userland.yml"

concurrency:
  group: userland-${{ github.run_id }}
  cancel-in-progress: false

env:
  THEOS: ${{ github.workspace }}/xnu-deps/theos-mac

jobs:
  mesa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: SDK (iPhoneOS 16.5, github.com/theos/sdks)
        run: |
          mkdir -p xnu-deps/theos-mac/sdks
          rm -rf "$RUNNER_TEMP/sdks"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          ln -s "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" xnu-deps/theos-mac/sdks/iPhoneOS16.5.sdk
          ls xnu-deps/theos-mac/sdks/iPhoneOS16.5.sdk | head

      - name: tools (meson, ninja, bison, flex, llvm-ar)
        run: |
          brew install -q meson ninja bison flex || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          # (no Xcode toolchain on PATH: its bison 2.3 would shadow the brew one Mesa needs)
          bison --version | head -1; meson --version; ninja --version

      - name: "build Mesa (libOSMesa.8.dylib, softpipe + freedreno)"
        run: |
          chmod +x xnu-deps/host/bin/xnu-clang xnu-deps/host/bin/xnu-clang++ tools/mk-mesa.sh
          bash tools/mk-mesa.sh

      - name: build gl_test
        run: |
          M=xnu-deps/build/mesa/out
          chmod +x xnu-deps/host/bin/xnu-clang
          xnu-deps/host/bin/xnu-clang -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -O1 \
            -framework CoreFoundation -framework IOKit -o gl_test userland/src/gl_test.c "$M/libOSMesa.8.dylib"
          file gl_test "$M/libOSMesa.8.dylib"
          ls -la gl_test "$M"

      # The EAGL side (libhakios.gl.dylib): the table of gl* entry points QuartzCore calls, built
      # from eagl_slots.txt + Mesa's gl.xml, plus eagl.c and the OSMesa back end. Needed for the
      # window server to draw with OpenGL ES instead of its software rasterizer.
      - name: build libhakios.gl.dylib (EAGL over OSMesa)
        run: |
          M=xnu-deps/build/mesa/out
          mkdir -p obj
          python3 userland/mkeagl.py userland/src/eagl_slots.txt "$M/gl.xml" "$M/exported-gl.txt" \
            userland/src/eagl.c > obj/eagl_gen.h
          wc -l obj/eagl_gen.h
          xnu-deps/host/bin/xnu-clang -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -O1 \
            -dynamiclib -install_name /redwood/lib/libhakios.gl.dylib -Iobj \
            -framework CoreFoundation -framework IOKit -framework IOSurface -lobjc \
            "$M/libOSMesa.8.dylib" -o libhakios.gl.dylib \
            userland/src/eagl.c userland/src/gl_osmesa.c
          file libhakios.gl.dylib; ls -la libhakios.gl.dylib

      # A forked child gets its own task ledger, so it does not inherit the
      # 6 MB per-task jetsam limit launchd puts on the job (see gl_runner.c).
      - name: build gl_runner
        run: |
          xnu-deps/host/bin/xnu-clang -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -O1             -o gl_runner userland/src/gl_runner.c
          file gl_runner; ls -la gl_runner

      # An exec'd binary without a code signature never gets CS_SIGNED, so XNU's
      # process_signature() blocks in __EXEC_WAITING_ON_TASKGATED_CODE_SIGNATURE_UPCALL__
      # forever on this port (no amfid): the whole machine stops. An ad-hoc signature
      # reaches sweet_amfi_vnode_check_signature, which sets CS_SIGNED and skips that path.
      - name: ad-hoc sign the binaries
        run: |
          M=xnu-deps/build/mesa/out
          codesign --force --sign - --timestamp=none gl_test libhakios.gl.dylib gl_runner
          codesign --force --sign - --timestamp=none "$M/libOSMesa.8.dylib"
          echo "--- gl_test"; codesign -dvvv gl_test 2>&1 | sed -n '1,8p'
          echo "--- libhakios.gl"; codesign -dvvv libhakios.gl.dylib 2>&1 | sed -n '1,8p'
          echo "--- libOSMesa"; codesign -dvvv "$M/libOSMesa.8.dylib" 2>&1 | sed -n '1,8p'
          otool -l gl_test | grep -A4 LC_CODE_SIGNATURE
          ls -la gl_test libhakios.gl.dylib "$M/libOSMesa.8.dylib"

      - uses: actions/upload-artifact@v4
        with:
          name: userland-gl
          path: |
            xnu-deps/build/mesa/out/libOSMesa.8.dylib
            xnu-deps/build/mesa/out/exported-gl.txt
            xnu-deps/build/mesa/out/gl.xml
            gl_test
            gl_runner
            libhakios.gl.dylib
          if-no-files-found: error
